<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="login">
        <h1>Bem-Vindo</h1>

        <form>
          <div class="campo">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Exemplo@gmail.com"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="••••••••••••"
              required
            />
          </div>

          <button type="submit">Entre</button>
        </form>

        <div class="separador">
          <span></span>
          <p>ou</p>
          <span></span>
        </div>

        <p class="cadastro">
          Você não tem uma conta?
          <a href="#">Cadastre-se</a>
        </p>
      </section>

      <section class="imagem">
        <img src="./img/folhas.pnj.jpg" alt="folhas" />
      </section>
    </main>
  </body>
</html>
